<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />

    <meta http-equiv="pragma" content="no-cache" />

    <title>Created with GameMaker</title>

    <style>
        body {
            background: #000;
            color: #cccccc;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
        }

        #canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            max-width: 1366px;
            max-height: 768px;
            aspect-ratio: 1366 / 768;
        }

        /* Full-screen styles */
        :-webkit-full-screen #canvas {
            width: 100%;
            height: 100%;
        }

        :-webkit-full-screen {
            width: 100%;
            height: 100%;
        }

        div.gm4html5_div_class {
            margin: 0;
            padding: 0;
            border: 0;
        }

        div.gm4html5_login {
            padding: 20px;
            position: absolute;
            border: solid 2px #000;
            background-color: #404040;
            color: #00ff00;
            border-radius: 15px;
            box-shadow: 20px 20px 40px #101010;
        }

        div.gm4html5_cancel_button {
            float: right;
        }

        div.gm4html5_login_button {
            float: left;
        }

        div.gm4html5_login_header {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="1366" height="768">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

        <script type="text/javascript" src="html5game/platformer.js?cachebust=88698650"></script>

    <script>
        function resizeCanvas() {
            const canvas = document.getElementById('canvas');
            const aspectRatio = 1366 / 768;  // Aspect ratio of the game

            let windowWidth = window.innerWidth;
            let windowHeight = window.innerHeight;

            if (windowWidth / windowHeight < aspectRatio) {
                // Window is narrower, scale based on width
                canvas.style.width = windowWidth + 'px';
                canvas.style.height = (windowWidth / aspectRatio) + 'px';
            } else {
                // Window is wider, scale based on height
                canvas.style.width = (windowHeight * aspectRatio) + 'px';
                canvas.style.height = windowHeight + 'px';
            }
        }

        window.onload = function () {
            GameMaker_Init();
            resizeCanvas();  // Initial resize
            window.addEventListener('resize', resizeCanvas);  // Resize on window change
        };
    </script>
</body>

</html>
